[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline"
dynamic = ["version"]
description = "Verifiable run bundles for reproducible AI and agent execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Powfu" }]
keywords = ["llm", "agents", "reproducibility", "provenance", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Powfu-zwx/proofline"
Repository = "https://github.com/Powfu-zwx/proofline"
Issues = "https://github.com/Powfu-zwx/proofline/issues"

[project.scripts]
proofline = "proofline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.21"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]

[tool.setuptools.dynamic]
version = { attr = "proofline.model.PACKAGE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
